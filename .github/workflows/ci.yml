name: MerchantOS CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Validate application
        working-directory: backend
        run: |
          node --check src/server.js
          node -e "require('./src/app')"
          node -e "require('./src/services/agentExecutionService')"

  ai-service:
    name: AI Service CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate Python files
        working-directory: ai-service
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/routes.py
          python -m py_compile app/agents/buyer_agent.py
          python -m py_compile app/agents/growth_agent.py
          python -m py_compile app/tools/analytics_tools.py

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - ai-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Frontend image
        run: docker build -t merchantos-frontend ./frontend

      - name: Build Backend image
        run: docker build -t merchantos-backend ./backend

      - name: Build AI Service image
        run: docker build -t merchantos-ai-service ./ai-service
