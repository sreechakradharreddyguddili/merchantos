name: MerchantOS CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Validate JavaScript syntax
        working-directory: backend
        shell: bash
        run: |
          set -e

          find src -type f -name "*.js" -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

  ai-service:
    name: AI Service CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate Python files
        working-directory: ai-service
        shell: bash
        run: |
          set -e

          find app -type f -name "*.py" -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            python -m py_compile "$file"
          done

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - ai-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Frontend image
        run: docker build -t merchantos-frontend ./frontend

      - name: Build Backend image
        run: docker build -t merchantos-backend ./backend

      - name: Build AI Service image
        run: docker build -t merchantos-ai-service ./ai-service
